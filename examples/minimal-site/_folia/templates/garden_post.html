{# A garden note, with its backlinks. #}{% extends "base.html" %}
{% block body %}
<article>
<h1>{{ page.title }}</h1>
{{ content | safe }}
{% if page.backlinks %}<h2>Backlinks</h2><ul>{% for link in page.backlinks %}<li><a href="{{ link.url }}">{{ link.title }}</a></li>{% endfor %}</ul>{% endif %}
</article>
{% endblock %}
