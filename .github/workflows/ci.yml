name: CI

# The checks `just check` runs, one job per kind, so branch protection can require each by name.
on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs run nothing; marking one ready for review runs the checks.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just fmt-check
      - run: just clippy
      - run: just test
      - run: just doc

  # The same tests on macOS, to learn whether Folia builds and passes there (it is developed and
  # deployed on Linux; Windows is not supported, see docs/development.md). Not part of branch
  # protection: a failure here is a finding, not a blocker, until it has been green for a while.
  rust-macos:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  deny:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      - run: just file-length
      - run: just lint-sh
      - run: just lint-md
      - run: just lint-py

  parity:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: taiki-e/install-action@just
      # lint-rb, baseline-negative (git and Ruby only: a stand-in replaces Jekyll) and
      # accept-negative (git and Python only: a stand-in replaces the checks)
      - run: just check-parity
