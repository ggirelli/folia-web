# Dependabot (security updates are enabled in the repository's settings; alerts stay on for every
# manifest). Everything is scanned and updated as usual: Cargo, the root Gemfile.lock, the
# workflows; the one entry below only turns off version-update pull requests for the Gemfile.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    # No version-update pull requests (there were none before this file): security updates have
    # their own limit and are not affected.
    open-pull-requests-limit: 0
