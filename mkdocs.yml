site_name: Folia
site_description: "A little more joy in publishing: a fast static site generator."
site_url: https://ggirelli.github.io/folia-web/
repo_url: https://github.com/ggirelli/folia-web
repo_name: ggirelli/folia-web
edit_uri: edit/main/docs/
copyright: Free software under the MIT license.

theme:
  name: material
  logo: assets/folia-logo.png
  favicon: assets/folia-logo.png
  palette:
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first site: getting-started/first-site.md
      - Build and deploy: getting-started/build-and-deploy.md
  - Guides:
      - Writing content: guide/content.md
      - Templates: guide/templates.md
      - Preview while you write: guide/preview.md
      - Drafts and scheduling: guide/drafts.md
      - Feeds, sitemap and search: guide/feeds-sitemap-search.md
      - Migrating from Jekyll: guide/migrating.md
  - Reference:
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Template context: reference/template-context.md
  - Internals:
      - Architecture: internals/architecture.md
      - Differences from Jekyll and known limitations: internals/differences-from-jekyll.md
      - Parity tools reference: internals/parity-reference.md
      - Parity governance: internals/parity-governance.md
  - Contributing:
      - Development setup: contributing/development-setup.md
      - Manual testing: contributing/manual-testing.md
      - Releasing: contributing/releasing.md
  - About: about.md
  - Release notes:
      - Folia 0.2.0: release-notes/v0.2.0.md
      - Folia 0.1.0: release-notes/v0.1.0.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - mdx_truly_sane_lists

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
